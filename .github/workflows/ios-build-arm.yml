name: Build Poforia iOS IPA ARM

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 55

    steps:
      - name: Checkout encrypted carrier
        uses: actions/checkout@v6

      - name: Decrypt source archive
        shell: bash
        env:
          SOURCE_KEY_B64: ${{ secrets.POFORIA_SOURCE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p source
          ruby <<'RUBY'
          require 'openssl'
          require 'base64'
          blob = File.binread('poforia-source.bin')
          iv = blob.byteslice(0, 16)
          ciphertext = blob.byteslice(16..)
          key = Base64.strict_decode64(ENV.fetch('SOURCE_KEY_B64'))

          cipher = OpenSSL::Cipher.new('AES-256-CBC')
          cipher.decrypt
          cipher.key = key
          cipher.iv = iv

          plain = cipher.update(ciphertext) + cipher.final
          File.binwrite('/tmp/poforia-source.zip', plain)
          RUBY
          ditto -x -k /tmp/poforia-source.zip source
          rm -f /tmp/poforia-source.zip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install JS dependencies
        working-directory: source
        run: npm ci

      - name: Generate native iOS project
        working-directory: source
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('app.json','utf8'));p.expo.ios.buildNumber='11';p.expo.version='1.0.0';fs.writeFileSync('app.json',JSON.stringify(p,null,2));"
          npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: source/ios
        run: pod install --repo-update

      - name: Install Apple signing
        id: signing
        shell: bash
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/poforia-dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/poforia.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/poforia-signing.keychain-db"
          KEYCHAIN_PASSWORD="poforia-ci-keychain"

          printf '%s' "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Configure Xcode signing and version
        working-directory: source
        shell: bash
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail

          PROFILE_UUID="$PROFILE_UUID" ruby <<'RUBY'
          require 'xcodeproj'

          project_path = Dir['ios/*.xcodeproj'].first
          raise 'No Xcode project generated' unless project_path

          project = Xcodeproj::Project.open(project_path)
          app_target = project.targets.find { |t| t.product_type == 'com.apple.product-type.application' }
          raise 'Application target not found' unless app_target

          app_target.build_configurations.each do |config|
            config.build_settings['DEVELOPMENT_TEAM'] = 'K8KG2APH2Z'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_UUID')
            config.build_settings['CURRENT_PROJECT_VERSION'] = '11'
            config.build_settings['MARKETING_VERSION'] = '1.0.0'
          end

          project.save
          puts "Configured #{app_target.name}"
          RUBY

      - name: Archive
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"

          SCHEME="Poforia"
          AVAILABLE_SCHEMES=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import json,sys; print('\n'.join(json.load(sys.stdin)['workspace']['schemes']))")
          echo "$AVAILABLE_SCHEMES" | grep -Fx "$SCHEME" >/dev/null || { echo "Poforia scheme not found. Available schemes:"; echo "$AVAILABLE_SCHEMES"; exit 1; }

          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Poforia.xcarchive" archive DEVELOPMENT_TEAM=K8KG2APH2Z CURRENT_PROJECT_VERSION=11 MARKETING_VERSION=1.0.0

      - name: Create export options
        shell: bash
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>K8KG2APH2Z</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.arifaydinkoca.poforia</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/Poforia.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" Poforia-1.0.0-11.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: poforia-ios-11-arm
          path: Poforia-1.0.0-11.ipa
          if-no-files-found: error
          retention-days: 7


